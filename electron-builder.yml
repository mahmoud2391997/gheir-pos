appId: com.gheir.pos
productName: GHEIR POS

directories:
  output: release
  buildResources: electron/assets

files:
  - dist/public/**/*
  - dist-electron/**/*
  - package.json

asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"

extraResources:
  - from: electron/assets/icon.png
    to: icon.png

publish:
  - provider: github
    owner: mahmoud2391997
    repo: gheir-pos

afterSign: scripts/notarize.cjs

linux:
  target:
    - AppImage
  category: Office
  icon: electron/assets/icon.png
  executableName: gheir-pos
  synopsis: GHEIR retail register
  description: Point of sale for the GHEIR store.
  desktop:
    entry:
      Name: GHEIR POS
      Comment: GHEIR retail register
      StartupWMClass: gheir-pos

mac:
  target:
    - dmg
  category: public.app-category.business
  icon: electron/assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist

win:
  target:
    - nsis
  icon: electron/assets/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: GHEIR POS
  uninstallDisplayName: GHEIR POS
  menuCategory: GHEIR POS
